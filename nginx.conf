server {
    listen 80;
    root /usr/share/nginx/html;

    # - assets com hash no nome: cache longa. O index.html nunca fica em cache, senão um deploy novo não chega aos dispositivos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # - SPA (react-router): qualquer rota desconhecida devolve o index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
